# Railway deployment configuration for FreelanceDash.
#
# Railway does NOT read Replit's .replit file, so the production start
# sequence lives here. The startCommand runs database migrations before
# gunicorn begins serving, so a deploy can never bind against a stale or
# empty schema. gunicorn imports main:app; the app binds Railway's injected
# $PORT (main.py itself never runs under gunicorn).
#
# Required environment variables (set in the Railway service, see .env.example):
#   FLASK_SECRET_KEY, DATABASE_URL, APP_URL, MAIL_* , GOOGLE_OAUTH_*,
#   POLAR_API_KEY, POLAR_WEBHOOK_SECRET, POLAR_PROFESSIONAL_*_PRICE_ID.
# Do NOT set FLASK_ENV=development in production (it re-enables debug on the
# `python main.py` entrypoint).

[build]
builder = "nixpacks"

[deploy]
# gunicorn settings (bind $PORT, gthread workers, timeouts, stdout logs) live
# in gunicorn.conf.py so they can be tuned per plan via env without a code edit.
#
# Email delivery: send_email enqueues to the EmailDeliveryLog outbox and an
# in-process drainer thread (started at boot) sends queued mail every
# EMAIL_DRAIN_INTERVAL_SECONDS (default 60s). No extra service is required.
# To run the drainer as a dedicated Railway cron service instead, set
# EMAIL_DRAINER_ENABLED=0 on the web service and add a second service whose
# command is `flask --app main drain-emails` on a "*/1 * * * *" schedule.
startCommand = "flask --app main db upgrade && exec gunicorn -c gunicorn.conf.py main:app"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
