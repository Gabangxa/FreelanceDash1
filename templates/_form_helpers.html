{# Shared form-rendering helpers.
   Import with: {% from "_form_helpers.html" import required_label %}
#}

{% macro required_label(field) -%}
<label class="form-label" for="{{ field.id }}">{{ field.label.text }}{% if field.flags.required %} <span class="required-marker" aria-hidden="true">*</span>{% endif %}</label>
{%- endmacro %}
