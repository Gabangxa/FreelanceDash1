{% if daily_hours|sum > 0 %}
    <canvas id="timeTrackingChart" height="100" data-hours="{{ daily_hours|tojson }}"></canvas>
{% else %}
    <div class="empty-state-modern empty-state-compact">
        <div class="empty-icon">
            <i class="fas fa-chart-bar"></i>
        </div>
        <h3>No time data this week</h3>
        <p>Start tracking your time to see your productivity insights</p>
        <a href="{{ url_for('projects.batch_time_entries') }}" class="quick-action-btn primary">
            <i class="fas fa-plus"></i>Add Time Entry
        </a>
    </div>
{% endif %}
